<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- thẻ meta có tên: viewport này để web có thể hiển thị trên mọi thiết bị -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soléa — Fashion for a Brighter You</title>
    <!-- (cmt) Tailwind CSS(242 màu) là một thư viện CSS giúp thiết kế giao diện website nhanh hơn mà không cần tự viết quá nhiều CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            50: '#fdf2f5',
                            100: '#fce7f0',
                            200: '#fbcfe8',
                            300: '#f472b6',
                            400: '#db2777',
                            500: '#be185d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Dòng này có nghĩa là: trang này lket với file css qua thẻ link -->
     <!-- rel="stylesheet" có nghĩa khai báo đường link này là để lk với 1 trang tạo kiểu
     href="style.css" dchi của trang css -->
    <!-- (cmt) -->
</head>
<body></body>
</html>
